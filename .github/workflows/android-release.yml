name: Build MazkipGamers Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk MazkipGamers-v1.0.0-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MazkipGamers-Android-APK
          path: MazkipGamers-v1.0.0-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v1.0.${{ github.run_number }}"
          gh release create "$TAG" MazkipGamers-v1.0.0-unsigned.apk \
            --title "MazkipGamers Android v1.0.${{ github.run_number }}" \
            --notes "Build otomatis MazkipGamers Android WebView. APK ini unsigned untuk pengujian; perlu ditandatangani dengan keystore sebelum distribusi produksi."
